<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b141a">
  <title>Open WhatsApp</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b141a;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(32px, 9vw, 48px);
      line-height: 1.05;
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    a {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 14px;
      color: #071a0e;
      background: #25d366;
      font-size: 17px;
      font-weight: 750;
      text-decoration: none;
    }

    a:last-child {
      color: #fff;
      background: #202c33;
      border: 1px solid #34444c;
    }

    a:hover { filter: brightness(1.08); }

    a:focus-visible {
      outline: 3px solid #8ce9af;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Open WhatsApp</h1>

    <div class="buttons">
      <a id="regular-button" href="#">Open via wa.me</a>
      <a id="fallback-button" href="#">Open with store fallback</a>
    </div>
  </main>

  <script>
    // Replace with your WhatsApp number: digits only, without "+" or spaces.
    const WHATSAPP_NUMBER = "380XXXXXXXXX";
    const DEFAULT_FLOW = "FB_LANDING_01";

    const APP_STORE_URL =
      "https://apps.apple.com/app/whatsapp-messenger/id310633997";
    const PLAY_STORE_URL =
      "https://play.google.com/store/apps/details?id=com.whatsapp";

    const params = new URLSearchParams(window.location.search);
    const requestedFlow = params.get("flow") || DEFAULT_FLOW;
    const flow = requestedFlow
      .replace(/[^a-zA-Z0-9_-]/g, "")
      .slice(0, 48) || DEFAULT_FLOW;

    const message = `START ${flow.toUpperCase()}`;
    const encodedMessage = encodeURIComponent(message);
    const waMeUrl =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
    const whatsappSchemeUrl =
      `whatsapp://send?phone=${WHATSAPP_NUMBER}&text=${encodedMessage}`;

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const androidIntentUrl =
      `intent://send?phone=${WHATSAPP_NUMBER}&text=${encodedMessage}` +
      `#Intent;scheme=whatsapp;package=com.whatsapp;` +
      `S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end`;

    const regularButton = document.querySelector("#regular-button");
    const fallbackButton = document.querySelector("#fallback-button");

    regularButton.href = waMeUrl;
    fallbackButton.href = isAndroid
      ? androidIntentUrl
      : isIOS
        ? whatsappSchemeUrl
        : waMeUrl;

    fallbackButton.addEventListener("click", (event) => {
      if (!isIOS) return;

      event.preventDefault();

      let appOpened = false;
      let fallbackTimer;

      const detectAppOpen = () => {
        if (document.hidden) {
          appOpened = true;
          window.clearTimeout(fallbackTimer);
          document.removeEventListener("visibilitychange", detectAppOpen);
        }
      };

      document.addEventListener("visibilitychange", detectAppOpen);
      window.location.href = whatsappSchemeUrl;

      fallbackTimer = window.setTimeout(() => {
        document.removeEventListener("visibilitychange", detectAppOpen);

        if (!appOpened && !document.hidden) {
          window.location.href = APP_STORE_URL;
        }
      }, 1600);
    });
  </script>
</body>
</html>
