<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <meta name="description" content="Start a conversation with us on WhatsApp.">
  <title>Chat with us on WhatsApp</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0b141a;
      --surface: #111b21;
      --surface-light: #202c33;
      --text: #f1f4f5;
      --muted: #aebac1;
      --green: #25d366;
      --green-hover: #20bd5a;
      --focus: #8ce9af;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px
        max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 15% 5%, rgba(37, 211, 102, 0.15), transparent 34rem),
        linear-gradient(160deg, #0b141a 0%, #101d23 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      background: rgba(17, 27, 33, 0.92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .logo {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      place-items: center;
      border-radius: 22px;
      background: var(--green);
      box-shadow: 0 16px 34px rgba(37, 211, 102, 0.22);
    }

    .logo svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 46px);
      line-height: 1.06;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 400px;
      margin: 18px auto 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .button {
      display: inline-flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #071a0e;
      font-size: 17px;
      font-weight: 750;
      line-height: 1.2;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      background: var(--green-hover);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.16);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:focus-visible,
    .install-link:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .helper {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .return-note {
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--surface-light);
      color: #dce4e8;
      font-size: 14px;
      line-height: 1.5;
    }

    .install-link {
      display: inline-block;
      margin-top: 20px;
      color: #b7efca;
      font-size: 15px;
      font-weight: 650;
      text-underline-offset: 4px;
    }

    .privacy {
      margin: 30px 0 0;
      color: #7f8e96;
      font-size: 12px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" role="img">
        <path d="M16.04 3C9.41 3 4.02 8.27 4.02 14.75c0 2.28.67 4.5 1.94 6.39L4 28l7.08-1.84a12.18 12.18 0 0 0 4.95 1.05h.01c6.62 0 12.01-5.27 12.01-11.75C28.05 8.98 22.67 3 16.04 3Zm0 21.92h-.01a9.9 9.9 0 0 1-5.04-1.36l-.36-.21-4.2 1.09 1.12-4-.24-.38a9.3 9.3 0 0 1-1.48-5.04c0-5.23 4.39-9.48 9.79-9.48 2.61 0 5.07 1 6.91 2.8a9.31 9.31 0 0 1 2.87 6.69c0 5.23-4.39 9.49-9.76 9.49Zm5.38-7.1c-.29-.14-1.74-.84-2.01-.93-.27-.1-.47-.14-.67.14-.19.29-.76.93-.93 1.12-.17.19-.34.21-.63.07-.29-.14-1.24-.45-2.36-1.42a8.72 8.72 0 0 1-1.64-1.99c-.17-.29-.02-.44.13-.58.13-.13.29-.34.44-.5.15-.17.19-.29.29-.48.1-.19.05-.36-.02-.5-.07-.14-.67-1.57-.91-2.15-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.51.07-.78.36-.27.29-1.03.98-1.03 2.39 0 1.41 1.05 2.77 1.2 2.96.15.19 2.07 3.09 5.01 4.33.7.3 1.25.47 1.67.6.7.22 1.34.19 1.84.12.56-.08 1.74-.7 1.98-1.37.25-.67.25-1.24.17-1.36-.07-.12-.27-.19-.56-.33Z"/>
      </svg>
    </div>

    <h1>Chat with us<br>on WhatsApp</h1>

<br>     
<br> <br> 

    <a class="button" id="whatsapp-button" href="#" rel="noopener">
      <span>Chat on WhatsApp</span>
      <span aria-hidden="true">→</span>
    </a>

  

  </main>

  <script>
    /* ================================================================
       EDIT THESE VALUES
       Phone format: country code + number, digits only, without "+".
       Example for Ukraine: 380501234567
       ================================================================ */
    const WHATSAPP_NUMBER = "18333146788";
    const DEFAULT_FLOW = "FB_LANDING_01";

    const APP_STORE_URL =
      "https://apps.apple.com/app/whatsapp-messenger/id310633997";
    const PLAY_STORE_URL =
      "https://play.google.com/store/apps/details?id=com.whatsapp";
    const GENERIC_DOWNLOAD_URL = "https://www.whatsapp.com/download";

    const params = new URLSearchParams(window.location.search);

    // Example ad URL: https://your-site.com/?flow=summer_campaign
    // Only safe characters are accepted before the value is sent to WhatsApp.
    const requestedFlow = params.get("flow") || DEFAULT_FLOW;
    const flow = requestedFlow
      .replace(/[^a-zA-Z0-9_-]/g, "")
      .slice(0, 48) || DEFAULT_FLOW;

    const starterMessage = `START ${flow.toUpperCase()}`;
    const whatsappUrl =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(starterMessage)}`;

    const whatsappButton = document.querySelector("#whatsapp-button");
    const installLink = document.querySelector("#install-link");
    const returnNote = document.querySelector("#return-note");

    whatsappButton.href = whatsappUrl;

    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    installLink.href = isAndroid
      ? PLAY_STORE_URL
      : isIOS
        ? APP_STORE_URL
        : GENERIC_DOWNLOAD_URL;

    function markAttempted(eventName) {
      localStorage.setItem("whatsapp_attempted", "true");
      returnNote.hidden = false;

      // Meta Pixel event, if Meta Pixel is already installed on the page.
      if (typeof window.fbq === "function") {
        window.fbq("trackCustom", eventName, { flow });
      }

      // Google Tag Manager / GA event, if dataLayer is available.
      if (Array.isArray(window.dataLayer)) {
        window.dataLayer.push({ event: eventName, flow });
      }
    }

    whatsappButton.addEventListener("click", () => {
      markAttempted("WhatsAppChatClick");
    });

    installLink.addEventListener("click", () => {
      markAttempted("WhatsAppInstallClick");
    });

    if (localStorage.getItem("whatsapp_attempted") === "true") {
      whatsappButton.querySelector("span").textContent = "Open WhatsApp chat";
      returnNote.hidden = false;
    }
  </script>
</body>
</html>
